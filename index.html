<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Arbol Genealogico</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main>
      <section class="arbol">
        <div class="padres">
          <div class="card">
            <img src="images/Eddard.webp" alt="foto" style="width: 100%" />
            <div class="container">
              <h4><b>Eddard Stark</b></h4>
              <p>263 d.C.</p>
            </div>
          </div>
          <div class="card">
            <img src="images/catelyn.webp" alt="foto" style="width: 100%" />
            <div class="container">
              <h4><b>Catelyn Tully</b></h4>
              <p>264 d.C.</p>
            </div>
          </div>
        </div>
        <div class="hijos">
          <div class="card">
            <img src="images/robb.webp" alt="foto" style="width: 100%" />
            <div class="container">
              <h4><b>Robb Stark</b></h4>
              <p>283 d.C.</p>
            </div>
          </div>
          <div class="card">
            <img src="images/Sansa.webp" alt="foto" style="width: 100%" />
            <div class="container">
              <h4><b>Sansa Stark</b></h4>
              <p>286 d.C.</p>
            </div>
          </div>
          <div class="card">
            <img src="images/Arya.webp" alt="foto" style="width: 100%" />
            <div class="container">
              <h4><b>Arya Stark</b></h4>
              <p>289 d.C.</p>
            </div>
          </div>
          <div class="card">
            <img src="images/bran.jfif" alt="foto" style="width: 100%" />
            <div class="container">
              <h4><b>Brandon Stark</b></h4>
              <p>290 d.C.</p>
            </div>
          </div>
          <div class="card">
            <img src="images/rickon.webp" alt="foto" style="width: 100%" />
            <div class="container">
              <h4><b>Rickon Stark</b></h4>
              <p>295 d.C.</p>
            </div>
          </div>
        </div>
      </section>
      <section class="botones">
        <button class="btn-zoomin">+</button>
        <button class="btn-zoomout">-</button>
        <button class="add-char">Create</button>
      </section>
    </main>
  </body>
</html>
